<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CCNA 1 · Exam Prep</title><link rel="icon" href="data:,">
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1b1f2a;--m:#667085;--a:#4f46e5;--ok:#16a34a;--no:#dc2626;--b:#e3e6ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--c:#181c30;--t:#eef0f8;--m:#99a1ba;--a:#8b93ff;--b:#2a3050}}
:root[data-theme="dark"]{--bg:#0e1120;--c:#181c30;--t:#eef0f8;--m:#99a1ba;--a:#8b93ff;--b:#2a3050}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0}.sub{color:var(--m);margin:2px 0 14px}
.lg button{border:1px solid var(--b);background:var(--c);color:var(--t);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.lg button.on{background:var(--a);color:#fff;border-color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;cursor:pointer;text-align:left;color:var(--t);font:inherit;transition:.15s}
.card:hover{border-color:var(--a);transform:translateY(-2px)}
.card b{display:block;font-size:1.05rem}.card small{color:var(--m)}
.hero{background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;border:0}.hero small{color:#e9e6ff}
h2{font-size:1.05rem;margin:22px 0 10px;color:var(--m);text-transform:uppercase;letter-spacing:.05em}
.bar{height:8px;background:var(--b);border-radius:8px;overflow:hidden;margin:10px 0 18px}.bar i{display:block;height:100%;background:var(--a)}
.q{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px}
.o.sel{border-color:var(--a);background:rgba(79,70,229,.12)}
.q h3{margin:0 0 14px;font-size:1.1rem}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;border:1.5px solid var(--b);background:var(--bg);color:var(--t);font:inherit;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--a)}.o.ok{border-color:var(--ok);background:rgba(22,163,74,.15)}.o.no{border-color:var(--no);background:rgba(220,38,38,.15)}
.ex{margin-top:14px;padding:12px 14px;border-left:4px solid var(--a);background:var(--bg);border-radius:8px}
.btn{background:var(--a);color:#fff;border:0;padding:11px 20px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;margin:14px 8px 0 0}
.btn.g{background:var(--c);color:var(--t);border:1px solid var(--b)}
input{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--b);background:var(--c);color:var(--t);font:inherit}
table{width:100%;border-collapse:collapse;margin-top:12px}td{padding:8px;border-bottom:1px solid var(--b)}td:first-child{color:var(--m)}
.big{font-size:3rem;font-weight:800;text-align:center;margin:10px 0}
</style></head><body><main id="app"></main>

[4,"Which example is a Trojan horse?",["Malware disguised as a video game","Worm spreading via a vulnerability","Code attaching itself to legit programs","Malware needing manual spread"],0,"A Trojan looks like a legitimate program. Virus attaches; worm self-spreads.","Троян маскируется под обычную программу. Вирус прикрепляется; червь распространяется сам.","Троян әдеттегі бағдарлама болып көрінеді. Вирус жабысады; құрт өзі таралады."],

[0,"What is the purpose of having a converged network?",["High-speed connectivity for all end devices","Treat all data packets equally","Fault tolerance and high availability","Reduce the cost of deploying and maintaining the infrastructure"],3,"Voice, video and data share one network, so one infrastructure to build and maintain means lower cost.","Голос, видео и данные идут по одной сети — одна инфраструктура, ниже затраты.","Дауыс, бейне және деректер бір желіде — бір инфрақұрылым, шығын аз."],

[1,"An admin enabled service password-encryption, then issues no service password-encryption. What happens?",["Encryption is removed from all passwords","Only vty and console passwords are decrypted","No encryption is reversed","Only the enable password is decrypted"],2,"Encryption already applied is not reversed by the no form; it only affects new passwords.","Уже применённое шифрование команда no не отменяет; влияет только на новые пароли.","Қолданылған шифрлауды no пішімі кері қайтармайды; тек жаңа парольдерге әсер етеді."],

const N=[[1, "Three bank employees are using the corporate network. The first employee uses a web browser to view a company web page in order to read some announcements. The second employee accesses the corporate database to perform some financial transactions. The third employee participates in an important live audio conference with other corporate managers in branch offices. If QoS is implemented on this network, what will be the priorities from highest to lowest of the different data types?", ["financial transactions, audio conference, web page", "audio conference, financial transactions, web page", "audio conference, web page, financial transactions", "financial transactions, web page, audio conference"], 1, " QoS mechanisms enable the establishment of queue management strategies that enforce priorities for different categories of application data. Thus, this queuing enables voice data to have priority over transaction data, which has priority over web data."], [2, "What is a benefit of using cloud computing in networking?", ["End users have the freedom to use personal tools to access information and communicate across a business network.", "Network capabilities are extended without requiring investment in new infrastructure, personnel, or software.", "Technology is integrated into every-day appliances allowing them to interconnect with other devices, making them more ‘smart’ or automated.", "Home networking uses existing electrical wiring to connect devices to the network wherever there is an electrical outlet, saving the cost of installing data cables."], 1, " Cloud computing extends IT’s capabilities without requiring investment in new infrastructure, training new personnel, or licensing new software. These services are available on-demand and delivered economically to any device anywhere in the world without compromising security or function. BYOD is about end users having the freedom to use personal tools to access information and communicate across a business or campus network. Smart home technology is integrated into every-day appliances allowing them to interconnect with other devices, making them more ‘smart’ or automated. Powerline networking is a trend for home networking that uses existing electrical wiring to connect devices to the net"], [4, "What is the function of the shell in an OS?", ["It interacts with the device hardware.", "It interfaces between the users and the kernel.", "It provides dedicated firewall services.", "It provides the intrusion protection services for the device."], 1, " Most operating systems contain a shell and a kernel. The kernel interacts with the hardware and the shell interfaces between the kernel and the users."], [1, "A network technician is attempting to configure an interface by entering the following command: SanJose(config)# ip address 192.168.2.1 255.255.255.0. The command is rejected by the device. What is the reason for this?", ["The command is being entered from the wrong mode of operation.", "The command syntax is wrong.", "The subnet mask information is incorrect.", "The interface is shutdown and must be enabled before the switch will accept the IP address."], 0, " The wrong mode of operation is being used. The CLI prompt indicates that the mode of operation is global configuration. IP addresses must be configured from interface configuration mode, as indicated by the SanJose(config-if)# prompt."], [1, "An administrator uses the Ctrl-Shift-6 key combination on a switch after issuing the ping command. What is the purpose of using these keystrokes?", ["to restart the ping process", "to interrupt the ping process", "to exit to a different configuration mode", "to allow the user to complete the command"], 1, " To interrupt an IOS process such as ping or traceroute, a user enters the Ctrl-Shift-6 key combination. Tab completes the remainder of parameters or arguments within a command. To exit from configuration mode to privileged mode use the Ctrl-Z keystroke. CTRL-R will redisplay the line just typed, thus making it easier for the user to press Enter and reissue the ping command."], [1, "Refer to the exhibit. A network administrator is configuring access control to switch SW1. If the administrator uses a console connection to connect to the switch, which password is needed to access user EXEC mode? \u003ci>(exhibit not shown)\u003c/i>", ["letmein", "secretin", "linevtyin", "lineconin"], 3, " Telnet accesses a network device through the virtual interface configured with the line VTY command. The password configured under this is required to access the user EXEC mode. The password configured under the line console 0 command is required to gain entry through the console port, and the enable and enable secret passwords are used to allow entry into the privileged EXEC mode."], [2, "On which switch interface would an administrator configure an IP address so that the switch can be managed remotely?", ["FastEthernet0/1", "VLAN 1", "vty 0", "console 0"], 1, " Interface VLAN 1 is a virtual interface on a switch, called SVI (switch virtual interface). Configuring an IP address on the default SVI, interface VLAN 1, will allow a switch to be accessed remotely. The VTY line must also be configured to allow remote access, but an IP address cannot be configured on this line."], [4, "What protocol is responsible for controlling the size of segments and the rate at which segments are exchanged between a web client and a web server?", ["TCP", "IP", "HTTP", "Ethernet"], 0, " TCP is a Layer 4 protocol of the OSI model. TCP has several responsibilities in the network communication process. It divides large messages into smaller segments which are more efficient to send across the network. It also controls the size and rate of segments exchanged between clients and servers."], [1, "What is an advantage to using a protocol that is defined by an open standard?", ["A company can monopolize the market.", "The protocol can only be run on equipment from a specific vendor.", "An open standard protocol is not controlled or regulated by standards organizations.", "It encourages competition and promotes choices."], 3, " A monopoly by one company is not a good idea from a user point of view. If a protocol can only be run on one brand, it makes it difficult to have mixed equipment in a network. A proprietary protocol is not free to use. An open standard protocol will in general be implemented by a wide range of vendors."], [1, "What are two benefits of using a layered network model? (Choose two.)", ["It assists in protocol design.", "It speeds up packet delivery.", "It prevents designers from creating their own model.", "It prevents technology in one layer from affecting other layers.", "It ensures a device at one layer can function at the next higher layer."], [0, 3], " Some vendors have developed their own reference models and protocols. Today, if a device is to communicate on the Internet, the device must use the TCP/IP model. The benefits of using a layered model are as follows: assists in protocol design fosters competition between vendors prevents a technology that functions at one layer from affecting any other layer provides a common language for describing network functionality helps in visualizing the interaction between each layer and protocols between each layer"], [4, "Which two OSI model layers have the same functionality as two layers of the TCP/IP model? (Choose two.)", ["data link", "network", "physical", "session", "transport"], [1, 4], " The OSI transport layer is functionally equivalent to the TCP/IP transport layer, and the OSI network layer is equivalent to the TCP/IP internet layer. The OSI data link and physical layers together are equivalent to the TCP/IP network access layer. The OSI session layer (with the presentation layer) is included within the TCP/IP application layer."], [2, "A network engineer is measuring the transfer of bits across the company backbone for a mission critical database application. The engineer notices that the network throughput appears lower than the bandwidth expected. Which three factors could influence the differences in throughput? (Choose three.)", ["the amount of traffic that is currently crossing the network", "the sophistication of the encapsulation method applied to the data", "the type of traffic that is crossing the network", "the latency that is created by the number of network devices that the data is crossing", "the bandwidth of the WAN connection to the Internet", "the reliability of the gigabit Ethernet infrastructure of the backbone"], [0, 2, 3], " Throughput usually does not match the specified bandwidth of physical links due to multiple factors. These factors include, the amount of traffic, type of traffic, and latency created by the network devices the data has to cross."], [2, "A network administrator is troubleshooting connectivity issues on a server. Using a tester, the administrator notices that the signals generated by the server NIC are distorted and not usable. In which layer of the OSI model is the error categorized?", ["presentation layer", "network layer", "physical layer", "data link layer"], 2, " The NIC has responsibilities in both Layer 1 and Layer 2. The NIC encodes the frame as a series of signals that are transmitted onto the local media. This is the responsibility of the physical layer of the OSI model. The signal could be in the form of electrical, optical, or radio waves."], [2, "A network administrator is measuring the transfer of bits across the company backbone for a mission critical financial application. The administrator notices that the network throughput appears lower than the bandwidth expected. Which three factors could influence the differences in throughput? (Choose three.)", ["the amount of traffic that is currently crossing the network", "the sophistication of the encapsulation method applied to the data", "the type of traffic that is crossing the network", "the latency that is created by the number of network devices that the data is crossing", "the bandwidth of the WAN connection to the Internet", "the reliability of the gigabit Ethernet infrastructure of the backbone"], [0, 2, 3], " Throughput usually does not match the specified bandwidth of physical links due to multiple factors. These factors include, the amount of traffic, type of traffic, and latency created by the network devices the data has to cross."], [2, "What is a characteristic of the LLC sublayer?", ["It provides the logical addressing required that identifies the device.", "It provides delimitation of data according to the physical signaling requirements of the medium.", "It places information in the frame allowing multiple Layer 3 protocols to use the same network interface and media.", "It defines software processes that provide services to the physical layer."], 2, " The Logical Link Control (LLC) defines the software processes that provide services to the network layer protocols. The information is placed by LLC in the frame and identifies which network layer protocol is being used for the frame. This information allows multiple Layer 3 protocols, such as IPv4 and IPv6, to utilize the same network interface and media."], [2, "A network team is comparing physical WAN topologies for connecting remote sites to a headquarters building. Which topology provides high availability and connects some, but not all, remote sites?", ["mesh", "partial mesh", "hub and spoke", "point-to-point"], 1, " Partial mesh topologies provide high availability by interconnecting multiple remote sites, but do not require a connection between all remote sites. A mesh topology requires point-to-point links with every system being connected to every other system. A point-to-point topology is where each device is connected to one other device. A hub and spoke uses a central device in a star topology that connects to other point-to-point devices."], [2, "What are the three primary functions provided by Layer 2 data encapsulation? (Choose three.)", ["error correction through a collision detection method", "session control using port numbers", "data link layer addressing", "placement and removal of frames from the media", "detection of errors through CRC calculations", "delimiting groups of bits into frames", "conversion of bits into data signals"], [2, 4, 5], " Through the framing process, delimiters are used to identify the start and end of the sequence of bits that make up a frame. Data link layer addressing is added to enable a frame to be delivered to a destination node. A cyclic redundancy check (CRC) field is calculated on every bit and added to the frame. If the CRC value contained in the arriving frame is the same as the one the receiving node creates, the frame will be processed."], [2, "What will a host on an Ethernet network do if it receives a frame with a destination MAC address that does not match its own MAC address?", ["It will discard the frame.", "It will forward the frame to the next host.", "It will remove the frame from the media.", "It will strip off the data-link frame to check the destination IP address."], 0, " In an Ethernet network, each NIC in the network checks every arriving frame to see if the destination MAC address in the frame matches its own MAC address. If there is no match, the device discards the frame. If there is a match, the NIC passes the frame up to the next OSI layer."], [2, "What are two examples of the cut-through switching method? (Choose two.)", ["store-and-forward switching", "fast-forward switching", "CRC switching", "fragment-free switching", "QOS switching"], [1, 3], " Store-and forward switching accepts the entire frame and performs error checking using CRC before forwarding the frame. Store-and-forward is often required for QOS analysis. Fast-forward and fragment-free are both variations of the cut-through switching method where only part of the frame is received before the switch begins to forward it."], [3, "What are two actions performed by a Cisco switch? (Choose two.)", ["building a routing table that is based on the first IP address in the frame header", "using the source MAC addresses of frames to build and maintain a MAC address table", "forwarding frames with unknown destination IP addresses to the default gateway", "utilizing the MAC address table to forward frames via the destination MAC address", "examining the destination MAC address to add new entries to the MAC address table"], [1, 3], "Important actions that a switch performs are as follows: When a frame comes in, the switch examines the Layer 2 source address to build and maintain the Layer 2 MAC address table. It examines the Layer 2 destination address to determine how to forward the frame. When the destination address is in the MAC address table, then the frame is sent out a particular port. When the address is unknown, the frame is sent to all ports that have devices connected to that network."], [2, "Which frame forwarding method receives the entire frame and performs a CRC check to detect errors before forwarding the frame?", ["cut-through switching", "store-and-forward switching", "fragment-free switching", "fast-forward switching"], 1, "Fast-forward and fragment-free switching are variations of cut-through switching, which begins to forward the frame before the entire frame is received."], [3, "Refer to the exhibit. If host A sends an IP packet to host B, what will the destination address be in the frame when it leaves host A? \u003ci>(exhibit not shown)\u003c/i>", ["DD:DD:DD:DD:DD:DD", "172.168.10.99", "CC:CC:CC:CC:CC:CC", "172.168.10.65", "BB:BB:BB:BB:BB:BB", "AA:AA:AA:AA:AA:AA"], 4, " When a host sends information to a distant network, the Layer 2 frame header will contain a source and destination MAC address. The source address will be the originating host device. The destination address will be the router interface that connects to the same network. In the case of host A sending information to host B, the source address is AA:AA:AA:AA:AA:AA and the destination address is the MAC address assigned to the R2 Ethernet interface, BB:BB:BB:BB:BB:BB."], [3, "What addresses are mapped by ARP?", ["destination MAC address to a destination IPv4 address", "destination IPv4 address to the source MAC address", "destination IPv4 address to the destination host name", "destination MAC address to the source IPv4 address"], 0, " ARP, or the Address Resolution Protocol, works by mapping a destination MAC address to a destination IPv4 address. The host knows the destination IPv4 address and uses ARP to resolve the corresponding destination MAC address."], [3, "What information is added during encapsulation at OSI Layer 3?", ["source and destination MAC", "source and destination application protocol", "source and destination port number", "source and destination IP address"], 3, " IP is a Layer 3 protocol. Layer 3 devices can open the Layer 3 header to inspect the Layer 3 header which contains IP-related information including the source and destination IP addresses."], [3, "What are two services provided by the OSI network layer? (Choose two.)", ["performing error detection", "routing packets toward the destination", "encapsulating PDUs from the transport layer", "placement of frames on the media", "collision detection"], [1, 2], "The OSI network layer provides several services to allow communication between devices: addressing encapsulation routing de-encapsulation Error detection, placing frames on the media, and collision detection are all functions of the data ink layer."], [3, "Refer to the exhibit. The network administrator for a small advertising company has chosen to use the 192.168.5.96/27 network for internal LAN addressing. As shown in the exhibit, a static IP address is assigned to the company web server. However, the web server cannot access the Internet. The administrator verifies that local workstations with IP addresses that are assigned by a DHCP server can access the Internet, and the web server is able to ping local workstations. Which component is incorrectly configured? \u003ci>(exhibit not shown)\u003c/i>", ["subnet mask", "DNS address", "host IP address", "default gateway address"], 3, " When a 255.255.255.224 subnet mask is used, the first three bits of the last octet are part of the network portion for an IPv4 address in the subnet. For the 192.168.5.96/27 network, valid host addresses are 192.168.5.97 through 192.168.5.126. The default gateway address is for the Layer 3 device on the same network and it must contain an IP address within the valid IP address range."], [3, "Why does a Layer 3 device perform the ANDing process on a destination IP address and subnet mask?", ["to identify the broadcast address of the destination network", "to identify the host address of the destination host", "to identify faulty frames", "to identify the network address of the destination network"], 3, " ANDing allows us to identify the network address from the IP address and the network mask."], [1, "What are two functions of NVRAM? (Choose two.)", ["to store the routing table", "to retain contents when power is removed", "to store the startup configuration file", "to contain the running configuration file", "to store the ARP table"], [1, 2], "NVRAM is permanent memory storage, so the startup configuration file is preserved even if the router loses power."], [1, "Refer to the exhibit. What will be the result of entering this configuration the next time a network administrator connects a console cable to the router and no additional commands have been entered? \u003ci>(exhibit not shown)\u003c/i>", ["The administrator will be required to enter Cisco123.", "The administrator will be required to enter Cisco234.", "The administrator will be required to enter Cisco789.", "The administrator will be presented with the R1&gt; prompt."], 3, "Until both the password password and the login commands are entered in console line configuration mode, no password is required to gain access to enable mode."], [3, "What is the dotted decimal representation of the IPv4 address 11001011.00000000.01110001.11010011?", ["192.0.2.199", "198.51.100.201", "203.0.113.211", "209.165.201.223"], 2, " Each section (octet) contains eight binary digits. Each digit represents a specific value (128, 64, 32, 16, 8, 4, 2, and 1). Everywhere there is a 1, the specific value is relevant. Add all relevant values in a particular octet to obtain the decimal value. For example binary 11001011 equals 203 in decimal."], [3, "What are three characteristics of multicast transmission? (Choose three.)", ["The source address of a multicast transmission is in the range of 224.0.0.0 to 224.0.0.255.", "A single packet can be sent to a group of hosts.", "Multicast transmission can be used by routers to exchange routing information.", "Routers will not forward multicast addresses in the range of 224.0.0.0 to 224.0.0.255.", "Computers use multicast transmission to request IPv4 addresses.", "Multicast messages map lower layer addresses to upper layer addresses."], [1, 2, 3], " Broadcast messages consist of single packets that are sent to all hosts on a network segment. These types of messages are used to request IPv4 addresses, and map upper layer addresses to lower layer addresses. A multicast transmission is a single packet sent to a group of hosts and is used by routing protocols, such as OSPF and RIPv2, to exchange routes. The address range 224.0.0.0 to 224.0.0.255 is reserved for link-local addresses to reach multicast groups on a local network."], [3, "What are the three ranges of IP addresses that are reserved for internal private use? (Choose three.)", ["10.0.0.0/8", "64.100.0.0/14", "127.16.0.0/12", "172.16.0.0/12", "192.31.7.0/24", "192.168.0.0/16"], [0, 3, 5], " The private IP address blocks that are used inside companies are as follows: 10.0.0.0 /8 (any address that starts with 10 in the first octet) 172.16.0.0 /12 (any address that starts with 172.16 in the first two octets through 172.31.255.255) 192.168.0.0 /16 (any address that starts with 192.168 in the first two octets)"], [3, "What purpose does NAT64 serve in IPv6?", ["It converts IPv6 packets into IPv4 packets.", "It translates private IPv6 addresses into public IPv6 addresses.", "It enables companies to use IPv6 unique local addresses in the network.", "It converts regular IPv6 addresses into 64-bit addresses that can be used on the Internet.", "It converts the 48-bit MAC address into a 64-bit host address that can be used for automatic host addressing."], 0, " NAT64 is typically used in IPv6 when networks are being transitioned from IPv4 to IPv6. It allows the IPv6 networks to connect to IPv4 networks (such as the Internet), and works by translating the IPv6 packets into IPv4 packets."], [3, "Which range of link-local addresses can be assigned to an IPv6-enabled interface?", ["FEC0::/10", "FDEE::/7", "FE80::/10", "FF00::/8"], 2, " Link-local addresses are in the range of FE80::/10 to FEBF::/10. The original IPv6 specification defined site-local addresses and used the prefix range FEC0::/10, but these addresses were deprecated by the IETF in favor of unique local addresses. FDEE::/7 is a unique local address because it is in the range of FC00::/7 to FDFF::/7. IPv6 multicast addresses have the prefix FF00::/8."], [3, "Which three addresses are valid public addresses? (Choose three.)", ["198.133.219.17", "192.168.1.245", "10.15.250.5", "128.107.12.117", "192.15.301.240", "64.104.78.227"], [0, 3, 5], "The ranges of private IPv4 addresses are as folllows: 10.0.0.0 – 10.255.255.255 172.16.0.0 – 172.31.255.255 192.168.0.0 – 192.168.255.255"], [3, "Refer to the exhibit. On the basis of the output, which two statements about network connectivity are correct? (Choose two.) \u003ci>(exhibit not shown)\u003c/i>", ["There is connectivity between this device and the device at 192.168.100.1.", "The connectivity between these two hosts allows for videoconferencing calls.", "There are 4 hops between this device and the device at 192.168.100.1.", "The average transmission time between the two hosts is 2 milliseconds.", "This host does not have a default gateway configured."], [0, 2], " The output displays a successful Layer 3 connection between a host computer and a host at 19.168.100.1. It can be determined that 4 hops exist between them and the average transmission time is 1 milliseconds. Layer 3 connectivity does not necessarily mean that an application can run between the hosts."], [3, "How many valid host addresses are available on an IPv4 subnet that is configured with a /26 mask?", ["254", "190", "192", "62", "64"], 3, " When a /26 mask is used, 6 bits are used as host bits. With 6 bits, 64 addresses are possible, but one address is for the subnet number and one address is for a broadcast. This leaves 62 addresses that can be assigned to network devices."], [3, "A site administrator has been told that a particular network at the site must accommodate 126 hosts. Which subnet mask would be used that contains the required number of host bits?", ["255.255.255.0", "255.255.255.128", "255.255.255.224", "255.255.255.240"], 1, " The subnet mask of 255.255.255.0 has 8 host bits. The mask of 255.255.255.128 results in 7 host bits. The mask of 255.255.255.224 has 5 host bits. Finally, 255.255.255.240 represents 4 host bits."], [3, "A network administrator wants to have the same subnet mask for three subnetworks at a small site. The site has the following networks and numbers of devices:\u003cbr>Subnetwork A: IP phones – 10 addresses\u003cbr>Subnetwork B: PCs – 8 addresses\u003cbr>Subnetwork C: Printers – 2 addresses\u003cbr>What single subnet mask would be appropriate to use for the three subnetworks?", ["255.255.255.0", "255.255.255.240", "255.255.255.248", "255.255.255.252"], 1, " If the same mask is to be used, then the network with the most hosts must be examined for number of hosts. Because this is 10 hosts, 4 host bits are needed. The /28 or 255.255.255.240 subnet mask would be appropriate to use for these networks."], [3, "Which subnet would include the address 192.168.1.96 as a usable host address?", ["192.168.1.64/26", "192.168.1.32/27", "192.168.1.32/28", "192.168.1.64/29"], 0, " For the subnet of 192.168.1.64/26, there are 6 bits for host addresses, yielding 64 possible addresses. However, the first and last subnets are the network and broadcast addresses for this subnet. Therefore, the range of host addresses for this subnet is 192.168.1.65 to 192.168.1.126. The other subnets do not contain the address 192.168.1.96 as a valid host address."], [3, "What subnet mask is needed if an IPv4 network has 40 devices that need IP addresses and address space is not to be wasted?", ["255.255.255.0", "255.255.255.128", "255.255.255.192", "255.255.255.224", "255.255.255.240"], 2, " In order to accommodate 40 devices, 6 host bits are needed. With 6 bits, 64 addresses are possible, but one address is for the subnet number and one address is for a broadcast. This leaves 62 addresses that can be assigned to network devices. The mask associated with leaving 6 host bits for addressing is 255.255.255.192."], [4, "What are two characteristics shared by TCP and UDP? (Choose two.)", ["default window size", "connectionless communication", "port numbering", "3-way handshake", "ability to to carry digitized voice", "use of checksum"], [2, 5], " Both TCP and UDP use source and destination port numbers to distinguish different data streams and to forward the right data segments to the right applications. Error checking the header and data is done by both protocols by using a checksum calculation to determine the integrity of the data that is received. TCP is connection-oriented and uses a 3-way handshake to establish an initial connection. TCP also uses window to regulate the amount of traffic sent before receiving an acknowledgment. UDP is connectionless and is the best protocol for carry digitized VoIP signals."], [4, "Why are port numbers included in the TCP header of a segment?", ["to indicate the correct router interface that should be used to forward a segment", "to identify which switch ports should receive or forward the segment", "to determine which Layer 3 protocol should be used to encapsulate the data", "to enable a receiving host to forward the data to the appropriate application", "to allow the receiving host to assemble the packet in the proper order"], 3, "✔ to enable a receiving host to forward the data to the appropriate application"], [3, "Refer to the exhibit. Consider the IP address of 192.168.10.0/24 that has been assigned to a high school building. The largest network in this building has 100 devices. If 192.168.10.0 is the network number for the largest network, what would be the network number for the next largest network, which has 40 devices? \u003ci>(exhibit not shown)\u003c/i>", ["192.168.10.0", "192.168.10.128", "192.168.10.192", "192.168.10.224", "192.168.10.240"], 1, " The first thing to calculate is what IP addresses are used by the largest LAN. Because the LAN has 100 hosts, 7 bits must be left for host bits. This would be a subnet mask of 255.255.255.128 for the largest LAN (192.168.10.0/25). The IP addresses range from 192.168.10.0 through 192.168.10.127. 192.168.10.0 is the network number (all 0s in the host bits) and 192.168.10.127 is the broadcast for this Ethernet LAN (all 1s in the host bits). The next available IP address is the next network number – 192.168.10.128."], [3, "Which statement is true about variable-length subnet masking?", ["Each subnet is the same size.", "The size of each subnet may be different, depending on requirements.", "Subnets may only be subnetted one additional time.", "Bits are returned, rather than borrowed, to create additional subnets."], 1, " In variable-length subnet masking, bits are borrowed to create subnets. Additional bits may be borrowed to create additional subnets within the original subnets. This may continue until there are no bits available to borrow."], [4, "In what two situations would UDP be the preferred transport protocol over TCP? (Choose two.)", ["when applications need to guarantee that a packet arrives intact, in sequence, and unduplicated", "when a faster delivery mechanism is needed", "when delivery overhead is not an issue", "when applications do not need to guarantee delivery of the data", "when destination port numbers are dynamic"], [1, 3], " UDP is a stateless protocol, which means that neither device on either end of the conversation must keep track of the conversation. As a stateless protocol, UDP is used as the Layer 4 protocol for applications that need speedy (best-effort) delivery. An example of such traffic is the transport of digitized voice or video."], [3, "What important information is added to the TCP/IP transport layer header to ensure communication and connectivity with a remote network device?", ["timing and synchronization", "destination and source port numbers", "destination and source physical addresses", "destination and source logical network addresses"], 1, " The destination and source port numbers are used to identify exactly which protocol and process is requesting or responding to a request."], [4, "What is the TCP mechanism used in congestion avoidance?", ["three-way handshake", "socket pair", "two-way handshake", "sliding window"], 3, " TCP uses windows to attempt to manage the rate of transmission to the maximum flow that the network and destination device can support while minimizing loss and retransmissions. When overwhelmed with data, the destination can send a request to reduce the of the window. This congestion avoidance is called sliding windows."], [3, "Which scenario describes a function provided by the transport layer?", ["A student is using a classroom VoIP phone to call home. The unique identifier burned into the phone is a transport layer address used to contact another network device on the same network.", "A student is playing a short web-based movie with sound. The movie and sound are encoded within the transport layer header.", "A student has two web browser windows open in order to access two web sites. The transport layer ensures the correct web page is delivered to the correct browser window.", "A corporate worker is accessing a web server located on a corporate network. The transport layer formats the screen so the web page appears properly no matter what device is being used to view the web site."], 2, " The source and destination port numbers are used to identify the correct application and window within that application."], [3, "A user opens three browsers on the same PC to access www.cisco.com to search for certification course information. The Cisco web server sends a datagram as a reply to the request from one of the web browsers. Which information is used by the TCP/IP protocol stack in the PC to identify which of the three web browsers should receive the reply?", ["the destination IP address", "the destination port number", "the source IP address", "the source port number"], 1, " Each web browser client application opens a randomly generated port number in the range of the registered ports and uses this number as the source port number in the datagram that it sends to a server. The server then uses this port number as the destination port number in the reply datagram that it sends to the web browser. The PC that is running the web browser application receives the datagram and uses the destination port number that is contained in this datagram to identify the client application."], [4, "What are two ways that TCP uses the sequence numbers in a segment? (Choose two.)", ["to identify missing segments at the destination", "to reassemble the segments at the remote location", "to specify the order in which the segments travel from source to destination", "to limit the number of segments that can be sent out of an interface at one time", "to determine if the packet changed during transit"], [0, 1], "✔ to identify missing segments at the destination; to reassemble the segments at the remote location"], [3, "Which two tasks are functions of the presentation layer? (Choose two.)", ["compression", "addressing", "encryption", "session control", "authentication"], [0, 2], " The presentation layer deals with common data format. Encryption, formatting, and compression are some of the functions of the layer. Addressing occurs in the network layer, session control occurs in the session layer, and authentication takes place in the application or session layer."], [4, "Which three statements characterize UDP? (Choose three.)", ["UDP provides basic connectionless transport layer functions.", "UDP provides connection-oriented, fast transport of data at Layer 3.", "UDP relies on application layer protocols for error detection.", "UDP is a low overhead protocol that does not provide sequencing or flow control mechanisms.", "UDP relies on IP for error detection and recovery.", "UDP provides sophisticated flow control mechanisms."], [0, 2, 3], " UDP is a simple protocol that provides the basic transport layer functions. It has much lower overhead than TCP because it is not connection-oriented and does not offer the sophisticated retransmission, sequencing, and flow control mechanisms that provide reliability."], [2, "What is a key characteristic of the peer-to-peer networking model?", ["wireless networking", "social networking without the Internet", "network printing using a print server", "resource sharing without a dedicated server"], 3, " The peer-to-peer (P2P) networking model allows data, printer, and resource sharing without a dedicated server."], [3, "A technician can ping the IP address of the web server of a remote company but cannot successfully ping the URL address of the same web server. Which software utility can the technician use to diagnose the problem?", ["tracert", "ipconfig", "netstat", "nslookup"], 3, " Traceroute (tracert) is a utility that generates a list of hops that were successfully reached along the path from source to destination.This list can provide important verification and troubleshooting information. The ipconfig utility is used to display the IP configuration settings on a Windows PC. The Netstat utility is used to identify which active TCP connections are open and running on a networked host. Nslookup is a utility that allows the user to manually query the name servers to resolve a given host name. This utility can also be used to troubleshoot name resolution issues and to verify the current status of the name servers."], [0, "Which domain name would be an example of a top-level domain?", ["www.cisco.com", "cisco.com", ".com", "root.cisco.com"], 2, " Top-level domains represent a country or type of organization, such as .com or .edu."], [3, "A PC obtains its IP address from a DHCP server. If the PC is taken off the network for repair, what happens to the IP address configuration?", ["The configuration is permanent and nothing changes.", "The address lease is automatically renewed until the PC is returned.", "The address is returned to the pool for reuse when the lease expires.", "The configuration is held by the server to be reissued when the PC is returned."], 2, " When a DCHP address is issued to a host, it is for a specific lease time. Once the lease expires, the address is returned to the DHCP pool."], [4, "When planning for network growth, where in the network should packet captures take place to assess network traffic?", ["on as many different network segments as possible", "only at the edge of the network", "between hosts and the default gateway", "only on the busiest network segment"], 0, " Because some types of traffic will be only on specific network segments, packet captures for analysis should be performed on as many segments as possible."], [4, "A wireless host needs to request an IP address. What protocol would be used to process the request?", ["FTP", "HTTP", "DHCP", "ICMP", "SNMP"], 2, " The DHCP protocol is used to request, issue, and manage IP addressing information. CSMA/CD is the access method used with wired Ethernet. ICMP is used to test connectivity. SNMP is used with network management and FTP is used for file transfer."], [2, "A network technician suspects that a particular network connection between two Cisco switches is having a duplex mismatch. Which command would the technician use to see the Layer 1 and Layer 2 details of a switch port?", ["show mac-address-table", "show ip interface brief", "show interfaces", "show running-config"], 2, " The show interfaces command can be used on both routers and switches to see speed, duplex, media type, MAC address, port type, and other Layer 1/Layer 2-related information."], [4, "A user is unable to reach the web site when typing http://www.cisco.com in a web browser, but can reach the same site by typing http://72.163.4.161. What is the issue?", ["default gateway", "DHCP", "TCP/IP protocol stack", "DNS"], 3, " Domain Name Service (DNS) is used to translate a web address to an IP address. The address of the DNS server is provided via DHCP to host computers."], [3, "A company is expanding its business to other countries. All branch offices must remain connected to corporate headquarters at all times. Which network technology is required to support this requirement?", ["LAN", "MAN", "WAN", "WLAN"], 2, " A local-area network (LAN) normally connects end users and network resources over a limited geographic area using Ethernet technology. A wireless LAN (WLAN) serves the same purpose as a LAN but uses wireless technologies. A metropolitan-area network (MAN) spans a larger geographic area such as a city, and a wide-area network (WAN) connects networks together over a large geographic area. WANs can span cities, countries, or the globe."], [2, "A home user is looking for an ISP connection that provides high speed digital transmission over regular phone lines. What ISP connection type should be used?", ["DSL", "dial-up", "satellite", "cell modem", "cable modem"], 0, "DSL is the best technology to use over existing phone lines. A lot of ISPs have a lookup on their website where you can enter your phone number and see if they can offer you service."], [1, "How does quality of service help a network support a wide range of applications and services?", ["by limiting the impact of a network failure", "by allowing quick recovery from network failures", "by providing mechanisms to manage congested network traffic", "by providing the ability for the network to grow to accommodate new users"], 2, " Quality of service (QoS), is a vital component of the architecture of a network. With QoS, network administrators can provide applications with predictable and measurable service guarantees through mechanisms that manage congested network traffic."], [3, "What source IP address does a router use by default when the traceroute command is issued?", ["the highest configured IP address on the router", "the lowest configured IP address on the router", "a loopback IP address", "the IP address of the outbound interface"], 3, " When sending an echo request message, a router will use the IP address of the exit interface as the source IP address. This default behavior can be changed by using an extended ping and specifying a specific source IP address."], [1, "After making configuration changes on a Cisco switch, a network administrator issues a copy running-config startup-config command. What is the result of issuing this command?", ["The new configuration will be stored in flash memory.", "The new configuration will be loaded if the switch is restarted.", "The current IOS file will be replaced with the newly configured file.", "The configuration changes will be removed and the original configuration will be restored."], 1, " With the copy running-config startup-config command, the content of the current operating configuration replaces the startup configuration file stored in NVRAM. The configuration file saved in NVRAM will be loaded when the device is restarted."], [1, "Refer to the exhibit. A network administrator is configuring access control to switch SW1. If the administrator has already logged into a Telnet session on the switch, which password is needed to access privileged EXEC mode? \u003ci>(exhibit not shown)\u003c/i>", ["letmein", "secretin", "lineconin", "linevtyin"], 1, " Telnet accesses a network device through the virtual interface configured with the line VTY command. The password configured under this is required to access the user EXEC mode. The password configured under the line console 0 command is required to gain entry through the console port, and the enable and enable secret passwords are used to allow entry into the privileged EXEC mode."], [1, "Which statement accurately describes a TCP/IP encapsulation process when a PC is sending data to the network?", ["Data is sent from the internet layer to the network access layer.", "Packets are sent from the network access layer to the transport layer.", "Segments are sent from the transport layer to the internet layer.", "Frames are sent from the network access layer to the internet layer."], 2, " When the data is traveling from the PC to the network, the transport layer sends segments to the internet layer. The internet layer sends packets to the network access layer, which creates frames and then converts the frames to bits. The bits are released to the network media."], [3, "What unique address is embedded in an Ethernet NIC and used for communication on an Ethernet network?", ["host address", "IP address", "MAC address", "network address", "k layer"], 2, " The MAC address is a 48-bit address that is burned into every Ethernet NIC. Each MAC address is unique throughout the world."], [3, "During the encapsulation process, what occurs at the data link layer for a PC connected to an Ethernet network?", ["An IP address is added.", "The logical address is added.", "The physical address is added.", "The process port number is added."], 2, " The Ethernet frame includes the source and destination physical address. The trailer includes a CRC value in the Frame Check Sequence field to allow the receiving device to determine if the frame has been changed (has errors) during the transmission."], [2, "What are two characteristics of Ethernet MAC addresses? (Choose two.)", ["They are globally unique.", "They are routable on the Internet.", "They are expressed as 12 hexadecimal digits.", "MAC addresses use a flexible hierarchical structure.", "MAC addresses must be unique for both Ethernet and serial interfaces on a device."], [0, 2], " An Ethernet MAC address is a 48-bit binary value expressed as 12 hexadecimal digits. MAC addresses must be globally unique by design. MAC addresses are in flat structure and thus they are not routable on the Internet. Serial interfaces do not use MAC addresses."], [3, "Under which two circumstances will a switch flood a frame out of every port except the port that the frame was received on? (Choose two.)", ["The frame has the broadcast address as the destination address.", "The destination address is unknown to the switch.", "The source address in the frame header is the broadcast address.", "The source address in the frame is a multicast address.", "The destination address in the frame is a known unicast address."], [0, 1], " A switch will flood a frame out of every port, except the one that the frame was received from, under two circumstances. Either the frame has the broadcast address as the destination address, or the destination address is unknown to the switch."], [1, "Which two commands can be used on a Windows host to display the routing table? (Choose two.)", ["netstat -s", "route print", "show ip route", "netstat -r", "tracert"], [1, 3], " On a Windows host, the route print or netstat -r commands can be used to display the host routing table. Both commands generate the same output. On a router, the show ip route command is used to display the routing table. The netstat –scommand is used to display per-protocol statistics. The tracert command is used to display the path that a packet travels to its destination."], [4, "Which two functions are primary functions of a router? (Choose two.)", ["packet forwarding", "microsegmentation", "domain name resolution", "path selection", "flow control"], [0, 3], "A router accepts a packet and accesses its routing table to determine the appropriate exit interface based on the destination address. The router then forwards the packet out of that interface."], [3, "What is the binary representation of 0xCA?", ["10111010", "11010101", "11001010", "11011010"], 2, " When converted, CA in hex is equivalent to 11011010 in binary. One way to do the conversion is one nibble at a time, C = 1100 and A = 1010. Combine the two nibbles gives 11001010."], [3, "Which service provides dynamic global IPv6 addressing to end devices without using a server that keeps a record of available IPv6 addresses?", ["stateful DHCPv6", "SLAAC", "static IPv6 addressing", "stateless DHCPv6"], 1, " Using stateless address autoconfiguration (SLAAC), a PC can solicit a router and receive the prefix length of the network. From this information the PC can then create its own IPv6 global unicast address."], [3, "What is the purpose of the command ping ::1?", ["It tests the internal configuration of an IPv6 host.", "It tests the broadcast capability of all hosts on the subnet.", "It tests the multicast connectivity to all hosts on the subnet.", "It tests the reachability of the default gateway for the network."], 0, " The address ::1 is an IPv6 loopback address. Using the command ping ::1 tests the internal IP stack to ensure that it is configured and functioning correctly. It does not test reachability to any external device, nor does it confirm that IPv6 addresses are properly configured on the host."], [3, "How many usable IP addresses are available on the 192.168.1.0/27 network?", ["256", "254", "62", "30", "16", "32"], 3, " A /27 mask is the same as 255.255.255.224. This leaves 5 host bits. With 5 host bits, 32 IP addresses are possible, but one address represents the subnet number and one address represents the broadcast address. Thus, 30 addresses can then be used to assign to network devices."], [4, "What is the process of dividing a data stream into smaller pieces before transmission?", ["segmentation", "encapsulation", "encoding", "flow control"], 0, " Data streams would cause significant network congestion if they were transmitted as a single large stream of bits. To increase efficiency, data streams are segmented into smaller more manageable pieces which are then transmitted over the network."], [3, "When IPv4 addressing is manually configured on a web server, which property of the IPv4 configuration identifies the network and host portion for an IPv4 address?", ["DNS server address", "subnet mask", "default gateway", "DHCP server address"], 1, "There are several components that need to be entered when configuring IPv4 for an end device: IPv4 address - uniquely identifies an end device on the network Subnet mask - determines the network address portion and host portion for an IPv4 address Default gateway - the IP address of the router interface used for communicating with hosts in another network DNS server address - the IP address of the Domain Name System (DNS) server DHCP server address (if DHCP is used) is not configured manually on end devices. It will be provided by a DHCP server when an end device requests an IP address."], [1, "Which two roles can a computer assume in a peer-to-peer network where a file is being shared between two computers? (Choose two.)", ["client", "master", "server", "slave", "transient"], [0, 2], " In a peer-to-peer (P2P) network, two or more computers are connected and can share resources without the use of a dedicated server. The computer that has the file acts as a server for the device (the client) that requests the file."], [4, "Which two protocols operate at the highest layer of the TCP/IP protocol stack? (Choose two.)", ["DNS", "Ethernet", "IP", "POP", "TCP", "UDP"], [0, 3], " The application layer is the top layer of the TCP/IP protocol stack. Application layer protocols include HTTP, DNS, HTML, TFTP, POP, IMAP, FTP, and SMTP."], [1, "What is one difference between the client-server and peer-to-peer network models?", ["Only in the client-server model can file transfers occur.", "Every device in a peer-to-peer network can function as a client or a server.", "A peer-to-peer network transfers data faster than a transfer using a client-server network.", "A data transfer that uses a device serving in a client role requires that a dedicated server be present."], 1, " Data transfer speeds depend on a number of factors including the amount of traffic, the quality of service imposed, and the network media. Transfer speeds are not dependent on the network model type. File transfers can occur using the client-server model or the peer-to-peer model. A data transfer between a device acting in the client role and a device acting in the server role can occur in both peer-to-peer and client-server networks."], [1, "What is the function of the HTTP GET message?", ["to request an HTML page from a web server", "to send error information from a web server to a web client", "to upload content to a web server from a web client", "to retrieve client email from an email server using TCP port 110"], 0, " There are three common HTTP message types: GET – used by clients to request data from the web server POST – used by clients to upload data to a web server PUT – used by clients to upload data to a web server"], [1, "Which networking model is being used when an author uploads one chapter document to a file server of a book publisher?", ["peer-to-peer", "master-slave", "client/server", "point-to-point"], 2, " In the client/server network model, a network device assumes the role of server in order to provide a particular service such as file transfer and storage. In the client/server network model, a dedicated server does not have to be used, but if one is present, the network model being used is the client/server model. In contrast, a peer-to-peer network does not have a dedicated server."], [4, "What network service resolves the URL entered on a PC to the IP address of the destination server?", ["DNS", "DHCP", "FTP", "SNMP"], 0, " When a client attempts to connect to a website, the destination URL must be resolved to an IP address. To do this the client queries a Domain Name System (DNS) server."], [1, "A network engineer is analyzing reports from a recently performed network baseline. Which situation would depict a possible latency issue?", ["a change in the bandwidth according to the show interfaces output", "a next-hop timeout from a traceroute", "an increase in host-to-host ping response times", "a change in the amount of RAM according to the show version output"], 2, " While analyzing historical reports an administrator can compare host-to-host timers from the ping command and depict possible latency issues."], [3, "Which firewall feature is used to ensure that packets coming into a network are legitimate responses to requests initiated from internal hosts?", ["stateful packet inspection", "URL filtering", "application filtering", "packet filtering"], 0, " Stateful packet inspection on a firewall checks that incoming packets are actually legitimate responses to requests originating from hosts inside the network. Packet filtering can be used to permit or deny access to resources based on IP or MAC address. Application filtering can permit or deny access based on port number. URL filtering is used to permit or deny access based on URL or on keywords."], [3, "What is one indication that a Windows computer did not receive an IPv4 address from a DHCP server?", ["The computer cannot ping 127.0.0.1.", "Windows displays a DHCP timeout message.", "The computer receives an IP address that starts with 169.254", "The computer cannot ping other devices on the same network with IP addresses in the 169.254.0.0/16 range."], 2, " When a Windows PC cannot communicate with an IPv4 DHCP server, the computer automatically assigns an IP address in the 169.254.0.0/16 range. Any other device on the same network that receives an address in the same range is reachable."], [1, "Which command can an administrator issue on a Cisco router to send debug messages to the vty lines?", ["terminal monitor", "logging console", "logging buffered", "logging synchronous"], 0, " Debug messages, like other IOS log messages, are sent to the console line by default. Sending these messages to the terminal lines requires the terminal monitor command."], [2, "A medium-sized business is researching available options for connecting to the Internet. The company is looking for a high speed option with dedicated, symmetric access. Which connection type should the company choose?", ["DSL", "dialup", "satellite", "leased line", "cable modem"], 3, "✔ leased line"], [0, "What characteristic of a network enables it to quickly grow to support new users and applications without impacting the performance of the service being delivered to existing users?", ["reliability", "scalability", "quality of service", "accessibility"], 1, " Networks must be able to quickly grow to support new users and services, without impacting existing users and services. This ability to grow is known as scalability."], [1, "After several configuration changes are made to a router, the copy running-configuration startup-configuration command is issued. Where will the changes be stored?", ["flash", "ROM", "NVRAM", "RAM", "the configuration register", "a TFTP server"], 2, "When changes are made to the running-config file, it should be saved to NVRAM as the startup configuration file in case the router is restarted or loses power. The following command saves the configuration to NVRAM: copy running-config startup-config"], [1, "Refer to the exhibit. From global configuration mode, an administrator is attempting to create a message-of-the-day banner by using the command banner motd V Authorized access only! Violators will be prosecuted! V When users log in using Telnet, the banner does not appear correctly. What is the problem? \u003ci>(exhibit not shown)\u003c/i>", ["The banner message is too long.", "The delimiting character appears in the banner message.", "The symbol “!” signals the end of a banner message.", "Message-of-the-day banners will only appear when a user logs in through the console port."], 1, "To create a banner message of the day on a device, use the banner motd # the message of the day # global config command. The \"#\" in the command syntax is called the delimiting character. It is entered before and after the message. The delimiting character can be any character as long as it does not occur in the message."], [2, "What are three characteristics of an SVI? (Choose three.)", ["It is designed as a security protocol to protect switch ports.", "It is not associated with any physical interface on a switch.", "It is a special interface that allows connectivity by different types of media.", "It is required to allow connectivity by any device at any location.", "It provides a means to remotely manage a switch.", "It is associated with VLAN1 by default."], [1, 4, 5], " Switches have one or more switch virtual interfaces (SVIs). SVIs are created in software since there is no physical hardware associated with them. Virtual interfaces provide a means to remotely manage a switch over a network that is using IP. Each switch comes with one SVI appearing in the default configuration “out-of-the-box.” The default SVI interface is VLAN1."], [1, "A technician configures a switch with these commands:\u003cbr>Copy\u003cbr>SwitchA(config)# interface vlan 1\u003cbr>SwitchA(config-if)# ip address 192.168.1.1 255.255.255.0\u003cbr>SwitchA(config-if)# no shutdown\u003cbr>What is the technician configuring?", ["Telnet access", "SVI", "password encryption", "physical switchport access"], 1, " For a switch to have an IP address, a switch virtual interface must be configured. This allows the switch to be managed remotely over the network."], [2, "In computer communication, what is the purpose of message encoding?", ["to convert information to the appropriate form for transmission", "to interpret information", "to break large messages into smaller frames", "to negotiate correct timing for successful communication"], 0, " Before a message is sent across a network it must first be encoded. Encoding is the process of converting the data message into another format suitable for transmission across the physical medium. Each bit of the message is encoded into a pattern of sounds, light waves, or electrical impulses depending on the network media over which the bits are transmitted. The destination host receives and decodes the signals in order to interpret the message."], [3, "What is a characteristic of multicast messages?", ["They are sent to a select group of hosts.", "They must be acknowledged.", "They are sent to a single destination.", "They are sent to all hosts on a network."], 0, " Multicast is a one-to-many type of communication. Multicast messages are addressed to a specific multicast group."], [1, "A large corporation has modified its network to allow users to access network resources from their personal laptops and smart phones. Which networking trend does this describe?", ["bring your own device", "video conferencing", "online collaboration", "cloud computing"], 0, " BYOD allows end users to use personal tools to access the corporate network. Allowing this trend can have major impacts on a network, such as security and compatibility with corporate software and devices."], [0, "True or False.\u003cbr>A dedicated server is not needed when implementing a peer-to-peer network.", ["true", "false"], 0, "✔ true"], [3, "What subnet mask is required to support 512 subnets on networks 172.28.0.0/16?", ["255.255.240.0", "255.255.255.224", "255.255.255.240", "255.255.255.128", "255.255.252.0"], 3, "✔ 255.255.255.128"], [3, "A DHCP server is used to IP addresses dynamically to the hosts on a network. The address pool is configured with 10.29.244.0/25. There are 19 printers on this network that need to use reserve static IP addresses from the pool. How many IP address in the pool are left to be assign to other hosts?", ["210", "60", "109", "107", "146"], 3, "✔ 107"], [3, "What is a function of the data link layer?", ["provides the formatting of data", "provides for the exchange of data over a common local media", "provides end-to-end delivery of data between hosts", "provides delivery of data between two applications"], 1, "✔ provides for the exchange of data over a common local media"], [4, "Which communication tool allows real-time collaboration?", ["wiki", "e-mail", "weblog", "instant messaging"], 3, "✔ instant messaging"], [3, "A host is accessing a Web server on a remote network. Which three functions are performed by intermediary network devices during this conversation? (Choose three.)", ["regenerating data signals", "acting as a client or a server", "providing a channel over which messages travel", "applying security settings to control the flow of data", "notifying other devices when errors occur", "serving as the source or destination of the messages"], [0, 3, 4], "✔ regenerating data signals; applying security settings to control the flow of data; notifying other devices when errors occur"], [1, "Refer to the exhibit. From which location did this router load the IOS? \u003ci>(exhibit not shown)\u003c/i>", ["flash memory", "NVRAM", "RAM", "ROM", "a TFTP server"], 0, "In the provided show version output, the line System image file is \"flash:c1841-advipservicesk9-mz.124-15.Tl.bin\" explicitly identifies the source of the Cisco IOS. The prefix flash: indicates that the router successfully located and loaded the operating system image from its internal flash memory during the boot process. Additionally, the configuration register value of 0x2102 confirms the router is set to follow standard boot procedures, which typically involve loading the first valid IOS image found in flash if no other specific boot instructions are present."], [1, "Refer to the exhibit. An administrator is trying to configure the switch but receives the error message that is displayed in the exhibit. What is the problem? \u003ci>(exhibit not shown)\u003c/i>", ["The entire command, configure terminal, must be used.", "The administrator is already in global configuration mode.", "The administrator must first enter privileged EXEC mode before issuing the command.", "The administrator must connect via the console port to access global configuration mode."], 2, " In order to enter global configuration mode, the command configure terminal, or a shortened version such as config t, must be entered from privileged EXEC mode. In this scenario the administrator is in user EXEC mode, as indicated by the &gt; symbol after the hostname. The administrator would need to use the enable command to move into privileged EXEC mode before entering the configure terminal command."], [4, "A network administrator is upgrading a small business network to give high priority to real-time applications traffic. What two types of network services is the network administrator trying to accommodate? (Choose two.)", ["SNMP", "instant messaging", "voice", "FTP", "video"], [2, 4], " Streaming media, such as video, and voice traffic, are both examples of real-time traffic. Real-time traffic needs higher priority through the network than other types of traffic because it is very sensitive to network delay and latency."], [3, "Which IPv4 address can be pinged to test the internal TCP/IP operation of a host?", ["0.0.0.0", "0.0.0.1", "127.0.0.1", "192.168.1.1", "255.255.255.255"], 2, "✔ 127.0.0.1"], [4, "What three application layer protocols are part of the TCP/IP protocol suite? (Choose three.)", ["ARP", "DHCP", "DNS", "FTP", "NAT", "PPP"], [1, 2, 3], "DNS, DHCP, and FTP are all application layer protocols in the TCP/IP protocol suite. ARP and PPP are network access layer protocols, and NAT is an internet layer protocol in the TCP/IP protocol suite."], [1, "Which two protocols function at the internet layer? (Choose two)", ["ARP", "BOOTP", "ICMP", "IP", "PPP"], [2, 3], "ICMP and IP both function at the internet layer, whereas PPP is a network access layer protocol, and POP and BOOTP are application layer protocols."], [0, "Which publicly available resources describe protocols, processes, and technologies for the Internet but do not give implementation details?", ["Request for Comments", "IRTF research papers", "protocol models", "IEEE standards"], 0, "✔ Request for Comments"], [3, "Which address on a PC does not change, even if the PC is moved to a different network?", ["IP address", "default gateway address", "MAC address", "logical address"], 2, "✔ MAC address"], [3, "What is the protocol that is used to discover a physical address from a known logical address and what message type does it use?", ["ARP, multicast", "DNS, unicast", "DNS, broadcast", "ARP, broadcast", "PING, multicast", "PING, broadcast"], 3, "An ARP request is broadcast to all devices on a LAN segment which seek the MAC address for a known IP address. Pings are used to verify connectivity between two devices, and DNS resolves URLs to IP addresses."], [3, "What will happen if the default gateway address is incorrectly configured on a host?", ["The host cannot communicate with other hosts in the local network.", "The switch will not forward packets initiated by the host.", "The host will have to use ARP to determine the correct address of the default gateway.", "The host cannot communicate with hosts in other networks.", "A ping from the host to 127.0.0.1 would not be successful."], 3, "When a host needs to send a message to another host located on the same network, it can forward the message directly. However, when a host needs to send a message to a remote network, it must use the router, also known as the default gateway. This is because the data link frame address of the remote destination host cannot be used directly. Instead, the IP packet has to be sent to the router (default gateway) and the router will forward the packet toward its destination. Therefore, if the default gateway is incorrectly configured, the host can communicate with other hosts on the same network, but not with hosts on remote networks."], [2, "What is an important function of the physical layer of the OSI model?", ["It accepts frames from the physical media.", "It encapsulates upper layer data into frames.", "It defines the media access method performed by the hardware interface.", "It encodes frames into electrical, optical, or radio wave signals."], 3, "The physical layer of the OSI model accepts frames from the data link layer and encodes it for transport as bits across the network media."], [2, "Which two statements describe the characteristics of fiber-optic cabling? (Choose two.)", ["Fiber-optic cabling does not conduct electricity.", "Fiber-optic cabling has high signal loss.", "Fiber-optic cabling is primarily used as backbone cabling.", "Multimode fiber-optic cabling carries signals from multiple sending devices.", "Fiber-optic cabling uses LEDs for single-mode cab?les and laser technology for multimode cables."], [0, 2], "Fiber-optic cabling is primarily used for high-traffic backbone cabling and does not conduct electricity. Multimode fiber uses LEDs for signaling and single-mode fiber uses laser technology. FIber-optic cabling carries signals from only one device to another."], [3, "What is contained in the trailer of a data-link frame?", ["logical address", "physical address", "data", "error detection"], 3, "The trailer in a data-link frame contains error detection information that is pertinent to the frame included in the FCS field. The header contains control information, such as the addressing, while the area that is indicated by the word “data” includes the data, transport layer PDU, and the IP header."], [3, "Refer to the exhibit. A ping to PC3 is issued from PC0, PC1, and PC2 in this exact order. Which MAC addresses will be contained in the S1 MAC address table that is associated with the Fa0/1 port? \u003ci>(exhibit not shown)\u003c/i>", ["just PC0 and PC1 MAC addresses", "just the PC0 MAC address", "PC0, PC1, and PC2 MAC addresses", "just the PC1 MAC address", "just the PC2 MAC address"], 0, "Switch S1 builds a MAC address table based on the source MAC address in the frame and the port upon which the frame enters the switch. The PC2 MAC address will be associated with port FA0/2. Because port FA0/1 of switch S1 connects with another switch, port FA0/1 will receive frames from multiple different devices. The MAC address table on switch S1 will therefore contain MAC addresses associated with each of the sending PCs."], [2, "How does a Layer 3 switch differ from a Layer 2 switch?", ["A Layer 3 switch supports VLANs, but a Layer 2 switch does not.", "An IP address can be assigned to a physical port of a Layer 3 switch. However, this is not supported in Layer 2 switches.", "A Layer 3 switch maintains an IP address table instead of a MAC address table.", "A Layer 3 switch learns the MAC addresses that are associated with each of its ports. However, a Layer 2 switch does not."], 1, "✔ An IP address can be assigned to a physical port of a Layer 3 switch. However, this is not supported in Layer 2 switches."], [3, "What is the purpose of the routing process?", ["to encapsulate data that is used to communicate across a network", "to select the paths that are used to direct traffic to destination networks", "to convert a URL name into an IP address", "to provide secure Internet file transfer", "to forward traffic on the basis of MAC addresses"], 1, "✔ to select the paths that are used to direct traffic to destination networks"], [3, "Refer to the exhibit. Consider the IP address configuration shown from PC1. What is a description of the default gateway address? \u003ci>(exhibit not shown)\u003c/i>", ["It is the IP address of the Router1 interface that connects the company to the Internet.", "It is the IP address of the Router1 interface that connects the PC1 LAN to Router1.", "It is the IP address of Switch1 that connects PC1 to other devices on the same LAN.", "It is the IP address of the ISP network device located in the cloud."], 1, "The default gateway is used to route packets destined for remote networks. The default gateway IP address is the address of the first Layer 3 device (the router interface) that connects to the same network."], [1, "Which two statements correctly describe a router memory type and its contents? (Choose two.)", ["ROM is nonvolatile and contains basic diagnostic software.", "FLASH is nonvolatile and contains a limited portion of the IOS.", "ROM is nonvolatile and stores the running IOS.", "RAM is volatile and stores the IP routing table.", "NVRAM is nonvolatile and stores other system files."], [0, 3], "ROM is a nonvolatile memory and stores bootup instructions, basic diagnostic software, and a limited IOS. Flash is a nonvolatile memory used as permanent storage for the IOS and other system-related files. RAM is volatile memory and stores the IP routing table, IPv4 to MAC address mappings in the ARP cache, packets that are buffered or temporarily stored, the running configuration, and the currently running IOS. NVRAM is a nonvolatile memory that stores the startup configuration file."], [1, "In which default order will a router search for startup configuration information?", ["NVRAM, RAM, TFTP", "NVRAM, TFTP, setup mode", "setup mode, NVRAM, TFTP", "TFTP, ROM, NVRAM", "flash, ROM, setup mode"], 1, "✔ NVRAM, TFTP, setup mode"], [4, "What happens when part of an Internet VoIP transmission is not delivered to the destination?", ["A delivery failure message is sent to the source host.", "The part of the VoIP transmission that was lost is re-sent.", "The entire transmission is re-sent.", "The transmission continues without the missing portion."], 3, "✔ The transmission continues without the missing portion."], [3, "Which three IP addresses are private ? (Choose three.)", ["10.172.168.1", "172.32.5.2", "192.167.10.10", "172.20.4.4", "192.168.5.254", "224.6.6.6"], [0, 3, 4], "The private IP addresses are within these three ranges: 10.0.0.0 - 10.255.255.255 172.16.0.0 - 172.31.255.255 192.168.0.0 - 192.168.255.255"], [3, "How many bits make up the single IPv6 hextet :10CD:?", ["4", "8", "16", "32"], 2, "A hextet consists of 4 hexadecimal characters. Each hexadecimal character is represented by four bits, giving a total of 16 bits."], [3, "What is the effect of configuring the ipv6 unicast-routing command on a router?", ["to assign the router to the all-nodes multicast group", "to enable the router as an IPv6 router", "to permit only unicast packets on the router", "to prevent the router from joining the all-routers multicast group"], 1, "When the ipv6 unicast-routing command is implemented on a router, it enables the router as an IPv6 router. Use of this command also assigns the router to the all-routers multicast group."], [3, "Which group of IPv6 addresses cannot be allocated as a host source address?", ["FEC0::/10", "FDFF::/7", "FEBF::/10", "FF00::/8"], 3, "✔ FF00::/8"], [3, "What is the purpose of ICMP messages?", ["to inform routers about network topology changes", "to ensure the delivery of an IP packet", "to provide feedback of IP packet transmissions", "to monitor the process of a domain name to IP address resolution"], 2, "The purpose of ICMP messages is to provide feedback about issues that are related to the processing of IP packets."], [3, "A network ad
