ministrator needs to monitor network traffic to and from servers in a data center. Which features of an IP addressing scheme should be applied to these devices?", ["random static addresses to improve security", "addresses from different subnets for redundancy", "predictable static IP addresses for easier identification", "dynamic addresses to reduce the probability of duplicate addresses"], 2, "When monitoring servers, a network administrator needs to be able to quickly identify them. Using a predictable static addressing scheme for these devices makes them easier to identify. Server security, redundancy, and duplication of addresses are not features of an IP addressing scheme."], [3, "Which two notations are useable nibble boundaries when subnetting in IPv6? (Choose two.)", ["/62", "/64", "/66", "/68", "/70"], [1, 3], "✔ /64; /68"], [4, "A host PC has just booted and is attempting to lease an address through DHCP. Which two messages will the client typically broadcast on the network? (Choose two.)", ["DHCPDISCOVER", "DHCPOFFER", "DHCPREQUEST", "DHCPACK", "DHCPNACK"], [0, 2], "When a host uses DHCP to automatically configure an IP address, the typically sends two messages: the DHCPDISCOVER message and the DHCPREQUEST message. These two messages are usually sent as broadcasts to ensure that all DHCP servers receive them. The servers respond to these messages using DHCPOFFER, DHCPACK, and DHCPNACK messages, depending on the circumstance."], [4, "What is the purpose of the network security accounting function?", ["to require users to prove who they are", "to determine which resources a user can access", "to keep track of the actions of a user", "to provide challenge and response questions"], 2, "Authentication, authorization, and accounting are network services collectively known as AAA. Authentication requires users to prove who they are. Authorization determines which resources the user can access. Accounting keeps track of the actions of the user."], [2, "What two preconfigured settings that affect security are found on most new wireless routers? (Choose two.)", ["broadcast SSID", "MAC filtering enabled", "WEP encryption enabled", "PSK authentication required", "default administrator password"], [0, 4], "✔ broadcast SSID; default administrator password"], [4, "Which type of wireless security generates dynamic encryption keys each time a client associates with an AP?", ["EAP", "PSK", "WEP", "WPA"], 3, "✔ WPA"], [2, "Which two components are necessary for a wireless client to be installed on a WLAN? (Choose two.)", ["media", "wireless NIC", "custom adapter", "crossover cable", "wireless bridge", "wireless client software"], [1, 5], "✔ wireless NIC; wireless client software"], [2, "When is a dial-up connection used to connect to an ISP?", ["when a cellular telephone provides the service", "when a high-speed connection is provided over a cable TV network", "when a satellite dish is used", "when a regular telephone line is used"], 3, "✔ when a regular telephone line is used"], [4, "On a school network, students are surfing the web, searching the library database, and attending an audio conference with their sister school in Japan. If network traffic is prioritized with QoS, how will the traffic be classified from highest priority to lowest priority?", ["audio conference, database, HTTP", "database, HTTP, audio conference", "audio conference, HTTP, database", "database, audio conference, HTTP"], 0, "✔ audio conference, database, HTTP"], [1, "During normal operation, from which location do most Cisco routers run the IOS?", ["RAM", "flash", "NVRAM", "disk drive"], 0, "When a Cisco switch is powered on, the IOS is copied into RAM. The switch then runs the IOS from RAM, thus enhancing operating performance."], [3, "Which keys act as a hot key combination that is used to interrupt an IOS process?", ["Ctrl-Shift-X", "Ctrl-Shift-6", "Ctrl-Z", "Ctrl-C"], 1, "The Cisco IOS provides both hot keys and shortcuts for configuring routers and switches. The Ctrl-Shift-6 hot key combination is used to interrupt an IOS process, such as a ping or traceroute. Ctrl-Z is used to exit the configuration mode. Ctrl-C aborts the current command. Ctrl-Shift-X has no IOS function."], [4, "A technician uses the ping 127.0.0.1 command. What is the technician testing?", ["the TCP/IP stack on a network host", "connectivity between two adjacent Cisco devices", "connectivity between a PC and the default gateway", "connectivity between two PCs on the same network", "physical connectivity of a particular PC and the network"], 0, "✔ the TCP/IP stack on a network host"], [2, "Which device should be used for enabling a host to communicate with another host on a different network?", ["switch", "hub", "router", "host"], 2, "✔ router"], [2, "Which characteristics describe fiber optic cable? (Choose two.)", ["It is not affected by EMI or RFI.", "Each pair of cables is wrapped in metallic foil.", "It combines the technique of cancellation, shielding and twisting to protect data.", "It has a maximum speed of 100 Mbps.", "It is the most expensive type of LAN cabling"], [0, 4], "✔ It is not affected by EMI or RFI.; It is the most expensive type of LAN cabling"], [2, "What are two features of a physical, star network topology? (Choose two.)", ["It is straightforward to troubleshoot.", "End devices are connected together by a bus.", "It is easy to add and remove end devices.", "All end devices are connected in a chain to each other.", "Each end system is connected to its respective neighbor."], [0, 2], "✔ It is straightforward to troubleshoot.; It is easy to add and remove end devices."], [2, "A frame is transmitted from one networking device to another. Why does the receiving device check the FCS field in the frame?", ["to determine the physical address of the sending device", "to verify the network layer protocol information", "to compare the interface media type between the sending and receiving ends", "to check the frame for possible transmission errors", "to verify that the frame destination matches the MAC address of the receiving device"], 3, "✔ to check the frame for possible transmission errors"], [2, "What will a Layer 2 switch do when the destination MAC address of a received frame is not in the MAC table?", ["It initiates an ARP request.", "It broadcasts the frame out of all ports on the switch.", "It notifies the sending host that the frame cannot be delivered.", "It forwards the frame out of all ports except for the port at which the frame was received."], 3, "✔ It forwards the frame out of all ports except for the port at which the frame was received."], [3, "Which parameter does the router use to choose the path to the destination when there are multiple routes available?", ["the lower metric value that is associated with the destination network", "the lower gateway IP address to get to the destination network", "the higher metric value that is associated with the destination network", "the higher gateway IP address to get to the destination network"], 0, "✔ the lower metric value that is associated with the destination network"], [1, "Which two statements describe the functions or characteristics of ROM in a router? (Choose two.)", ["stores routing tables", "allows software to be updated without replacing pluggable chips on the motherboard", "maintains instructions for POST diagnostics", "holds ARP cache", "stores bootstrap program"], [2, 4], "✔ maintains instructions for POST diagnostics; stores bootstrap program"], [1, "Which statement describes a characteristic of the Cisco router management ports?", ["A console port is used for remote management of the router.", "A console port is not used for packet forwarding.", "Serial and DSL interfaces are types of management ports.", "Each Cisco router has a LED indicator to provide information about the status of the management ports."], 1, "✔ A console port is not used for packet forwarding."], [3, "What types of addresses make up the majority of addresses within the /8 block IPv4 bit space?", ["private addresses", "public addresses", "multicast addresses", "experimental addresses"], 1, "✔ public addresses"], [3, "Refer to the exhibit. What is the maximum TTL value that is used to reach the destination www.cisco.com??\u003cbr>Networking Devices and Initial Configuration Course Final Exam 26 \u003ci>(exhibit not shown)\u003c/i>", ["11", "12", "13", "14"], 2, "Traceroute (in this case the command tracert) sets the TTL field to a value of 1 and sends the packet. At each router hop, this value is decreased by one and a \"TTL expired\" message is sent back to the source host. This message has a source address which is used by the host to build the trace. The host then progressively increments the TTL field (2, 3, 4...) for each sequence of messages until the destination is reached or it is incremented to a predefined maximum. Because the executed command reached the destination in the 13th line, the TTL was increased up to the value of 13."], [3, "A company has a network address of 192.168.1.64 with a subnet mask of 255.255.255.192. The company wants to create two subnetworks that would contain 10 hosts and 18 hosts respectively. Which two networks would achieve that? (Choose two.)", ["192.168.1.16/28", "192.168.1.64/27", "192.168.1.128/27", "192.168.1.96/28", "192.168.1.192/28"], [1, 3], "Subnet 192.168.1.64 /27 has 5 bits that are allocated for host addresses and therefore will be able to support 32 addresses, but only 30 valid host IP addresses. Subnet 192.168.1.96/28 has 4 bits for host addresses and will be able to support 16 addresses, but only 14 valid host IP addresses"], [3, "In a network that uses IPv4, what prefix would best fit a subnet containing 100 hosts?", ["/23", "/24", "/25", "/26"], 2, "✔ /25"], [0, "Which protocol supports rapid delivery of streaming media?", ["Transmission Control Protocol", "Real-Time Transport Protocol", "Secure File Transfer Protocol", "Video over Internet Protocol"], 1, "✔ Real-Time Transport Protocol"], [4, "Why would a network administrator use the tracert utility?", ["to determine the active TCP connections on a PC", "to check information about a DNS name in the DNS server", "to identify where a packet was lost or delayed on a network", "to display the IP address, default gateway, and DNS server address for a PC"], 2, "The tracert utility is used to identify the path a packet takes from source to destination. Tracert is commonly used when packets are dropped or not reaching a specific destination."], [4, "Which WLAN security protocol generates a new dynamic key each time a client establishes a connection with the AP?", ["EAP", "PSK", "WEP", "WPA"], 3, "✔ WPA"], [1, "Three office workers are using the corporate network. The first employee uses a web browser to view a company web page in order to read some announcements. The second employee accesses the corporate database to perform some financial transactions. The third employee participates in an important live audio conference with other office workers in branch offices. If QoS is implemented on this network, what will be the priorities from highest to lowest of the different data types?", ["audio conference, financial transactions, web page", "financial transactions, web page, audio conference", "audio conference, web page, financial transactions", "financial transactions, audio conference, web page"], 0, " QoS mechanisms enable the establishment of queue management strategies that enforce priorities for different categories of application data. Thus, this queuing enables voice data to have priority over transaction data, which has priority over web data."], [1, "A network administrator is making changes to the configuration of a router. After making the changes and verifying the results, the administrator issues the copy running-config startup-config command. What will happen after this command executes?", ["The configuration will be copied to flash.", "The configuration will load when the router is restarted.", "The new configuration file will replace the IOS file.", "The changes will be lost when the router restarts."], 1, "✔ The configuration will load when the router is restarted."], [4, "What information does the loopback test provide?", ["The TCP/IP stack on the device is working correctly.", "The device has end-to-end connectivity.", "DHCP is working correctly.", "The Ethernet cable is working correctly.", "The device has the correct IP address on the network."], 0, "Because the loopback test sends packets back to the host device, it does not provide information about network connectivity to other hosts. The loopback test verifies that the host NIC, drivers, and TCP/IP stack are functioning."], [2, "What happens when a switch receives a frame and the calculated CRC value is different than the value that is in the FCS field?", ["The switch places the new CRC value in the FCS field and forwards the frame.", "The switch notifies the source of the bad frame.", "The switch drops the frame.", "The switch floods the frame to all ports except the port through which the frame arrived to notify the hosts of the error."], 2, "The purpose of the CRC value in the FCS field is to determine if the frame has errors. If the frame does have errors, then the frame is dropped by the switch."], [2, "What is the auto-MDIX feature on a switch?", ["the automatic configuration of an interface for 10/100/1000 Mb/s operation", "the automatic configuration of an interface for a straight-through or a crossover Ethernet cable connection", "the automatic configuration of full-duplex operation over a single Ethernet copper or optical cable", "the ability to turn a switch interface on or off accordingly if an active connection is detected"], 1, "The auto-MDIX enables a switch to use a crossover or a straight-through Ethernet cable to connect to a device regardless of the device on the other end of the connection."], [2, "What are the two main components of Cisco Express Forwarding (CEF)? (Choose two.)", ["adjacency tables", "MAC-address tables", "routing tables", "ARP tables", "forwarding information base (FIB)"], [0, 4], "The forwarding information base (FIB) and adjacency tables are the main components of CEF. The FIB is similar to a routing table, but neither the routing table, nor the ARP table, nor the MAC-address table is part of CEF."], [3, "Which statement describes the sequence of processes executed by a router when it receives a packet from a host to be delivered to a host on another network?", ["It receives the packet and forwards it directly to the destination host.", "It de-encapsulates the packet, selects the appropriate path, and encapsulates the packet to forward it toward the destination host", "It de-encapsulates the packet and forwards it toward the destination host.", "It selects the path and forwards it toward the destination host."], 1, "The router receives the packet, de-encapsulates it to select the appropriate path, encapsulates the packet, and then forwards it toward the destination host."], [3, "Refer to the exhibit. Router R1 has two interfaces that were configured with correct IP addresses and subnet masks. Why does the show ip route command output not display any information about the directly connected networks? \u003ci>(exhibit not shown)\u003c/i>", ["The directly connected networks have to be created manually to be displayed in the routing table.", "The routing table will only display information about these networks when the router receives a packet.", "The no shutdown command was not issued on these interfaces.", "The gateway of last resort was not configured."], 2, "✔ The no shutdown command was not issued on these interfaces."], [4, "Which three statements characterize the transport layer protocols? (Choose three.)", ["TCP and UDP port numbers are used by application layer protocols.", "TCP uses port numbers to provide reliable transportation of IP packets.", "UDP uses windowing and acknowledgments for reliable transfer of data.", "TCP uses windowing and sequencing to provide reliable transfer of data.", "TCP is a connection-oriented protocol. UDP is a connectionless protocol."], [0, 3, 4], "✔ TCP and UDP port numbers are used by application layer protocols.; TCP uses windowing and sequencing to provide reliable transfer of data.; TCP is a connection-oriented protocol. UDP is a connectionless protocol."], [4, "Which statement is true regarding the UDP client process during a session with a server?", ["Datagrams that arrive in a different order than that in which they were sent are not placed in order.", "A session must be established before datagrams can be exchanged.", "A three-way handshake takes place before the transmission of data begins.", "Application servers have to use port numbers above 1024 in order to be UDP capable."], 0, "Because there are no sequence numbers in UDP segments, there is no possibility to arrange the datagrams in the correct order. Sessions and three-way handshake are related to TCP communications. UDP servers can use registered or nonregistered port numbers to listen to clients."], [3, "Which two components are configured via software in order for a PC to participate in a network environment? (Choose two.)", ["MAC address", "IP address", "kernel", "shell", "subnet mask"], [1, 4], "✔ IP address; subnet mask"], [3, "Which two reasons generally make DHCP the preferred method of assigning IP addresses to hosts on large networks? (Choose two.)", ["It eliminates most address configuration errors.", "It ensures that addresses are only applied to devices that require a permanent address.", "It guarantees that every device that needs an address will get one.", "It provides an address only to devices that are authorized to be connected to the network.", "It reduces the burden on network support staff."], [0, 4], "DHCP is generally the preferred method of assigning IP addresses to hosts on large networks because it reduces the burden on network support staff and virtually eliminates entry errors. However, DHCP itself does not discriminate between authorized and unauthorized devices and will assign configuration parameters to all requesting devices. DHCP servers are usually configured to assign addresses from a subnet range, so there is no guarantee that every device that needs an address will get one."], [3, "What is the subnet address for the address 2001:DB8:BC15:A:12AB::1/64?", ["2001:DB8:BC15::0", "2001:DB8:BC15:A::0", "2001:DB8:BC15:A:1::1", "2001:DB8:BC15:A:12::0"], 1, "✔ 2001:DB8:BC15:A::0"], [3, "Which field in an IPv4 packet header will typically stay the same during its transmission?", ["Packet Length", "Destination Address", "Flag", "Time-to-Live"], 1, "The value in the Destination Address field in an IPv4 header will stay the same during its transmission. The other options might change during its transmission."], [3, "What must be configured to enable Cisco Express Forwarding (CEF) on most Cisco devices that perform Layer 3 switching?", ["Manually configure next-hop Layer 2 addresses.", "Issue the no shutdown command on routed ports.", "CEF is enabled by default, so no configuration is necessary.", "Manually map Layer 2 addresses to Layer 3 addresses to populate the forwarding information base (FIB)."], 2, "✔ CEF is enabled by default, so no configuration is necessary."], [3, "What is the purpose of adjacency tables as used in Cisco Express Forwarding (CEF)?", ["to populate the forwarding information base (FIB)", "to maintain Layer 2 next-hop addresses", "to allow the separation of Layer 2 and Layer 3 decision making", "to update the forwarding information base (FIB)"], 1, "✔ to maintain Layer 2 next-hop addresses"], [3, "Which statement describes a characteristic of the network layer in the OSI model?", ["It manages the data transport between the processes running on each host.", "In the encapsulation process, it adds source and destination port numbers to the IP header.", "When a packet arrives at the destination host, its IP header is checked by the network layer to determine where the packet has to be routed.", "Its protocols specify the packet structure and processing used to carry the data from one host to another."], 3, "The transport layer manages the data transport between the processes that are running on each host. In the encapsulation process, the network layer adds the IP header information, such as the IP address of the source (sending) and destination (receiving) hosts. When a packet arrives at the network layer of the destination host, the host checks the IP header of the packet to verify if the destination IP address within the header matches its own IP address."], [3, "A user gets an IP address of 192.168.0.1 from the company network administrator. A friend of the user at a different company gets the same IP address on another PC. How can two PCs use the same IP address and still reach the Internet, send and receive email, and search the web?", ["Both users must be using the same Internet Service Provider.", "ISPs use Network Address Translation to change a user IP address into an address that can be used on the Internet.", "ISPs use Domain Name Service to change a user IP address into a public IP address that can be used on the Internet.", "Both users must be on the same network."], 1, "As user traffic from behind an ISP firewall reaches the gateway device, Network Address Translation changes private IP addresses into a public, routable IP address. Private user addresses remain hidden from the public Internet, and thus more than one user can have the same private IP address, regardless of ISP."], [4, "Why does HTTP use TCP as the transport layer protocol?", ["to ensure the fastest possible download speed", "because HTTP is a best-effort protocol", "because transmission errors can be tolerated easily", "because HTTP requires reliable delivery"], 3, "When a host requests a web page, transmission reliability and completeness must be guaranteed. Therefore, HTTP uses TCP as its transport layer protocol."], [3, "What is the valid most compressed format possible of the IPv6 address 2001:0DB8:0000:AB00:0000:0000:0000:1234?", ["2001:DB8:0:AB00::1234", "2001:DB8:0:AB::1234", "2001:DB8::AB00::1234", "2001:DB8:0:AB:0:1234"], 0, "There are two rules defining how an IPv6 address can be compressed. The first rule states that leading zeros in a hextet can be eliminated. The second rule states that a single :: can be used to represent one or more contiguous all zero hextets. There can be one and only one :: in an IPv6 address."], [0, "What field content is used by ICMPv6 to determine that a packet has expired?", ["TTL field", "CRC field", "Hop Limit field", "Time Exceeded field"], 2, "ICMPv6 sends a Time Exceeded message if the router cannot forward an IPv6 packet because the packet expired. The router uses a hop limit field to determine if the packet has expired, and does not have a TTL field."], [4, "Which firewall technique blocks incoming packets unless they are responses to internal requests?", ["port filtering", "stateful packet inspection", "URL filtering", "application filtering"], 1, "✔ stateful packet inspection"], [1, "A network technician is investigating network connectivity from a PC to a remote host with the address 10.1.1.5. Which command issued on the PC will return to the technician the complete path to the remote host?", ["trace 10.1.1.5", "traceroute 10.1.1.5", "tracert 10.1.1.5", "ping 10.1.1.5"], 2, "✔ tracert 10.1.1.5"], [2, "What is a possible hazard that can be caused by network cables in a fire?", ["The cable insulation could be flammable.", "Users could be exposed to excessive voltage.", "Network cables could be exposed to water.", "The network cable could explode."], 0, "✔ The cable insulation could be flammable."], [2, "What device is commonly used to verify a UTP cable?", ["a multimeter", "an Optical Time Domain Reflectometer", "a cable tester", "an ohmmeter"], 2 ibe how services are used on a server? (Choose two.)", ["Data sent with a service that uses TCP is received in the order the data was sent.", "A port is considered to be open when it has an active server application that is assigned to it.", "An individual server can have two services that are assigned to the same port number.", "An individual server cannot have multiple services running at the same time.", "Server security can be improved by closing ports that are associated with unused services."], [1, 4], "✔ A port is considered to be open when it has an active server application that is assigned to it.; Server security can be improved by closing ports that are associated with unused services."], [3, "Given the binary address of 11101100 00010001 00001100 00001010, which address does this represent in dotted decimal format?", ["234.17.10.9", "234.16.12.10", "236.17.12.6", "236.17.12.10"], 3, "The binary number 11101100 00010001 00001100 00001010 translates to 236.17.12.10."], [4, "A particular telnet site does not appear to be responding on a Windows 7 computer. What command could the technician use to show any cached DNS entries for this web page?", ["ipconfig /all", "arp -a", "ipconfig /displaydns", "nslookup"], 2, "✔ ipconfig /displaydns"], [4, "Which statement is true about DHCP operation?", ["When a device that is configured to use DHCP boots, the client broadcasts a DHCPDISCOVER message to identify any available DHCP servers on the network.", "A client must wait for lease expiration before it sends another DHCPREOUEST message.", "The DHCPDISCOVER message contains the IP address and sub net masK to be assigned, the IP address of the DNS server, and the IP address of the default gateway.", "If the client receives several DHCPOFFER messages from different servers, it sends a unicast DHCPREOUEST message to the server from which it chooses to obtain the IP information."], 0, "The client broadcasts a DHCPDISCOVER message to identify any available DHCP servers on function fin(id){const ca=CA(Q[id]);G.a=1;G.ok=ca.length==G.sel.length&&ca.every(x=>G.sel.includes(x));if(G.ok){G.s++;P.w=P.w.filter(x=>x!=id)}else if(!P.w.includes(id))P.w.push(id);sv();quiz()}
function nxt(){G.i++;G.a=null;G.sel=[];G.ok=0;if(G.i<G.ids.length)return quiz();const p=Math.round(G.s/G.ids.length*100);if(G.key!="rev")P.b[G.key]=Math.max(P.b[G.key]||0,p);sv();cur=()=>{};
$.innerHTML=hd()+`<div class="q"><h3>${L().res}</h3><div class="big" style="color:${p>=70?"var(--ok)":"var(--no)"}">${G.s} / ${G.ids.length} · ${p}%</div><div class="bar"><i style="width:${p}%"></i></div><button class="btn" onclick="start('${G.key}',shuf(G.ids))">${L().again}</button><button class="btn g" onclick="go(home)">${L().home}</button></div>`}
function calc(){$.innerHTML=hd()+`<div class="q"><h3>🧮 ${L().calc}</h3><input id="ip" placeholder="${L().ph}" oninput="calcR()" value="192.168.1.96/27"><div id="r"></div></div><button class="btn g" onclick="go(home)">← ${L().home}</button>`;calcR()}
function calcR(){const v=document.getElementById("ip").value.trim().match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)\/(\d+)$/),r=document.getElementById("r");if(!v||v.slice(1,5).some(x=>x>255)||v[5]>32){r.innerHTML="";return}
const p=+v[5],ip=((v[1]<<24)|(v[2]<<16)|(v[3]<<8)|+v[4])>>>0,m=p?(~0<<(32-p))>>>0:0,net=(ip&m)>>>0,bc=(net|~m)>>>0,f=n=>[24,16,8,0].map(s=>n>>>s&255).join("."),h=p>=31?0:2**(32-p)-2;
r.innerHTML=`<table><tr><td>${L().mask}</td><td>${f(m)}</td></tr><tr><td>${L().net}</td><td>${f(net)}</td></tr><tr><td>${L().bc}</td><td>${f(bc)}</td></tr><tr><td>${L().rng}</td><td>${h?f(net+1)+" – "+f(bc-1):"—"}</td></tr><tr><td>${L().hs}</td><td>${h}</td></tr></table>`}
home();
</script></body></html>
